<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murugesan Balasubramanian — AI & Data Science Student | Automation Enthusiast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-black: #060807;
    --bg-surface: #0a0e0c;
    --bg-card: #0e1411;
    --bg-card-hover: #121a16;
    --red-crimson: #E5232A;
    --red-glow: rgba(229, 35, 42, 0.45);
    --cyan-cyber: #00F2FE;
    --cyan-glow: rgba(0, 242, 254, 0.35);
    --amber-neon: #FF8C00;
    --mint-metallic: #8DA79B;
    --text-white: #F4F5F4;
    --text-muted: #8E9995;
    --text-dim: #54615C;
    --border-glass: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    scroll-behavior: smooth;
    background-color: var(--bg-black);
    color: var(--text-white);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-black);
    overflow-x: hidden;
    line-height: 1.6;
  }

  ::selection {
    background: var(--red-crimson);
    color: #fff;
  }

  a { color: inherit; text-decoration: none; }

  /* CURSOR GLOW (DESKTOP ONLY) */
  @media (pointer: fine) {
    .cursor-glow {
      position: fixed;
      top: 0; left: 0;
      width: 340px; height: 340px;
      margin-left: -170px; margin-top: -170px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.12) 0%, rgba(229, 35, 42, 0.08) 45%, transparent 70%);
      filter: blur(35px);
      will-change: transform;
    }

    .cursor-dot {
      position: fixed;
      top: 0; left: 0;
      width: 8px; height: 8px;
      margin-left: -4px; margin-top: -4px;
      border-radius: 50%;
      background: var(--cyan-cyber);
      box-shadow: 0 0 12px var(--cyan-cyber);
      pointer-events: none;
      z-index: 9999;
      will-change: transform;
    }
  }

  @media (pointer: coarse) {
    .cursor-glow, .cursor-dot { display: none !important; }
  }

  /* TELEMETRY LOGIC CANVAS (LEFT BOUND) */
  #circuitCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 4;
    pointer-events: none;
  }

  .film-grain {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 90;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ========================================================
     HOVER-ONLY TRAVELING BORDER LIGHT ANIMATION (BORDER BEAM)
     ======================================================== */
  .glow-card {
    position: relative;
    border-radius: 20px;
    padding: 2px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
  }

  .glow-card .border-beam {
    position: absolute;
    width: 320%;
    height: 320%;
    top: -110%;
    left: -110%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 55deg,
      var(--cyan-cyber) 75deg,
      var(--red-crimson) 95deg,
      var(--amber-neon) 115deg,
      transparent 135deg,
      transparent 360deg
    );
    animation: travelBeam 3.5s linear infinite;
    opacity: 0;
    transition: opacity 0.35s ease, filter 0.35s ease;
    pointer-events: none;
    z-index: 1;
  }

  .glow-card:hover .border-beam {
    opacity: 1;
    filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.85));
  }

  .glow-card.active:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.15);
  }

  .glow-card .card-inner {
    position: relative;
    background: #0e1411;
    border-radius: 18px;
    height: 100%;
    z-index: 2;
  }

  @keyframes travelBeam {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* ========================================================
     GLOBAL SCROLL-TRIGGERED REVEAL (BOTTOM TO TOP)
     ======================================================== */
  .reveal {
    opacity: 0;
    transform: translateY(42px);
    filter: blur(4px);
    transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform, filter;
  }

  .reveal.active {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }

  .reveal-delay-1 { transition-delay: 0.12s; }
  .reveal-delay-2 { transition-delay: 0.24s; }
  .reveal-delay-3 { transition-delay: 0.36s; }
  .reveal-delay-4 { transition-delay: 0.48s; }

  /* NAVIGATION */
  .nav-wrapper {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1320px, 94vw);
    z-index: 100;
  }

  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: rgba(10, 14, 12, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-glass);
    border-radius: 999px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
  }

  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-white);
    white-space: nowrap;
  }

  .status-dot {
    width: 8px; height: 8px;
    background: var(--cyan-cyber);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--cyan-cyber);
    animation: pulse 2.5s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  .nav-links {
    display: flex;
    gap: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
  }

  .nav-links a { color: var(--text-muted); transition: color 0.25s; }
  .nav-links a:hover, .nav-links a.active { color: var(--text-white); }

  .nav-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    padding: 8px 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-glass);
    border-radius: 999px;
    transition: all 0.25s;
    white-space: nowrap;
  }

  .nav-btn:hover {
    border-color: var(--red-crimson);
    color: #fff;
    box-shadow: 0 0 20px rgba(229, 35, 42, 0.4);
  }

  /* HERO */
  .hero-viewport {
    position: relative;
    width: 100vw;
    min-height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: #060807;
  }

  .hero-viewport::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 82% 48%, rgba(229, 35, 42, 0.30) 0%, rgba(229, 35, 42, 0.12) 38%, transparent 68%),
      radial-gradient(circle at 20% 50%, rgba(0, 242, 254, 0.08) 0%, transparent 50%);
    animation: ambientBackdropPulse 6s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes ambientBackdropPulse {
    0% { opacity: 0.55; transform: scale(0.97); }
    100% { opacity: 0.95; transform: scale(1.04); }
  }

  .hero-bg-media {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    will-change: transform;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes photoJumpIn {
    0% {
      opacity: 0;
      transform: scale(0.72) translateY(90px);
      filter: blur(14px) brightness(0.6);
    }
    55% {
      opacity: 1;
      transform: scale(1.04) translateY(-10px);
      filter: blur(0px) brightness(1.1);
    }
    75% { transform: scale(0.99) translateY(3px); }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0px) brightness(0.96);
    }
  }

  .hero-bg-media img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 85% center;
    filter: contrast(1.05) brightness(0.96);
    display: block;
    transform-origin: 82% 50%;
    animation: photoJumpIn 1.3s cubic-bezier(0.2, 1.3, 0.35, 1) forwards;
  }

  .hero-bg-scrim {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: 
      linear-gradient(90deg, 
        rgba(6, 8, 7, 0.98) 0%, 
        rgba(6, 8, 7, 0.90) 32%, 
        rgba(6, 8, 7, 0.35) 50%, 
        transparent 70%
      ),
      linear-gradient(180deg,
        rgba(6, 8, 7, 0.5) 0%,
        transparent 20%,
        transparent 80%,
        rgba(6, 8, 7, 0.95) 100%
      );
    pointer-events: none;
  }

  .hero-container {
    position: relative;
    z-index: 5;
    width: min(1320px, 92vw);
    margin: 0 auto;
    padding: 140px 0 80px;
    will-change: transform;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .hero-text-block {
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  @keyframes fadeInUp {
    0% {
      opacity: 0;
      transform: translateY(45px);
      filter: blur(4px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  .hero-text-block .eyebrow { animation: fadeInUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }
  .hero-text-block .title-red { animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
  .hero-text-block .title-white { animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
  .hero-text-block .hero-tagline { animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both; }
  .hero-text-block .hero-identity-badge { animation: fadeInUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
  .hero-text-block .hero-bio { animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
  .hero-text-block .hero-actions { animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.05s both; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2.5px;
    color: var(--cyan-cyber);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
  }

  .eyebrow-dot {
    width: 7px; height: 7px;
    background: var(--red-crimson);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--red-crimson);
    flex-shrink: 0;
  }

  .hero-headline { margin-top: 2px; margin-bottom: 4px; }

  .title-red {
    font-family: 'Playfair Display', serif;
    font-size: clamp(44px, 6.4vw, 88px);
    font-weight: 900;
    line-height: 0.92;
    color: var(--red-crimson);
    letter-spacing: -2px;
    text-transform: uppercase;
    text-shadow: 0 0 35px rgba(229, 35, 42, 0.35);
    white-space: nowrap;
  }

  .title-white {
    font-family: 'Playfair Display', serif;
    font-size: clamp(34px, 5.0vw, 74px);
    font-weight: 900;
    line-height: 0.95;
    color: var(--text-white);
    letter-spacing: -1.8px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .hero-tagline {
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .hero-bio {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.7;
    max-width: 480px;
  }

  .hero-identity-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-glass);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--mint-metallic);
    width: fit-content;
  }

  .hero-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 15px 34px;
    border-radius: 999px;
    background: var(--red-crimson);
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(229, 35, 42, 0.4);
    transition: all 0.25s ease;
    border: none;
    cursor: pointer;
  }

  .btn-primary:hover {
    background: #ff2f37;
    transform: translateY(-2px);
    box-shadow: 0 0 40px rgba(229, 35, 42, 0.65);
  }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-glass);
    color: var(--text-white);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    backdrop-filter: blur(10px);
    transition: all 0.25s;
  }

  .btn-ghost:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }

  /* PHOTO BACKUP NOTICE */
  #photoNotFoundNotice {
    display: none;
    position: fixed;
    bottom: 24px; left: 24px;
    z-index: 1000;
    background: rgba(14, 18, 16, 0.94);
    border: 1px solid var(--cyan-cyber);
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }

  .notice-btn {
    background: var(--red-crimson);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    margin-top: 8px;
    display: inline-block;
  }

  /* METRICS STRIP */
  .stats-bar {
    position: relative;
    z-index: 10;
    border-top: 1px solid var(--border-glass);
    border-bottom: 1px solid var(--border-glass);
    background: #090C0B;
    padding: 26px 0;
  }

  .container { width: min(1320px, 92vw); margin: 0 auto; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }

  .stat-card { font-family: 'JetBrains Mono', monospace; }

  .stat-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-white);
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .stat-value span { font-size: 12px; color: var(--red-crimson); }
  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* SECTIONS */
  .section {
    padding: 120px 0;
    position: relative;
    z-index: 10;
  }

  .section-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--red-crimson);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-tag::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--red-crimson);
    border-radius: 50%;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 4.2vw, 52px);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 24px;
  }

  .section-desc {
    color: var(--text-muted);
    font-size: 16px;
    max-width: 620px;
    line-height: 1.7;
    margin-bottom: 50px;
  }

  /* ABOUT SECTION */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
    align-items: start;
  }

  .about-card-inner {
    padding: 38px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .about-card-inner h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    color: #fff;
  }

  .about-card-inner p {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.75;
  }

  .timeline-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 10px;
  }

  .timeline-item {
    border-left: 2px solid var(--cyan-cyber);
    padding-left: 18px;
    position: relative;
  }

  .timeline-item::before {
    content: '';
    position: absolute;
    left: -6px; top: 4px;
    width: 10px; height: 10px;
    background: var(--cyan-cyber);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--cyan-cyber);
  }

  .timeline-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }

  .timeline-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--cyan-cyber);
    margin: 3px 0 8px;
    letter-spacing: 1px;
  }

  .timeline-desc {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* PROJECTS */
  .project-list {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .project-card-inner {
    padding: 36px 42px;
    display: grid;
    grid-template-columns: 70px 1.4fr 1fr 180px;
    gap: 28px;
    align-items: center;
    cursor: pointer;
  }

  .proj-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--text-dim);
    font-weight: 700;
  }

  .glow-card:hover .proj-num { color: var(--cyan-cyber); }

  .proj-status-badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 3px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    margin-bottom: 8px;
    width: fit-content;
  }

  .badge-progress {
    background: rgba(229, 35, 42, 0.15);
    border: 1px solid var(--red-crimson);
    color: #ff474d;
  }

  .badge-exp {
    background: rgba(0, 242, 254, 0.12);
    border: 1px solid var(--cyan-cyber);
    color: var(--cyan-cyber);
  }

  .badge-learning {
    background: rgba(141, 167, 155, 0.12);
    border: 1px solid var(--mint-metallic);
    color: var(--mint-metallic);
  }

  .proj-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }

  .proj-desc {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .proj-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .proj-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-glass);
    border-radius: 999px;
    color: var(--mint-metallic);
  }

  .proj-cta {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-white);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    transition: color 0.2s;
  }

  .glow-card:hover .proj-cta { color: var(--cyan-cyber); }

  /* SKILLS */
  .skills-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }

  .skills-column {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .skill-card-inner {
    padding: 26px 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .skill-header {
    display: flex;

    align-items: center;
  }

  .skill-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
  }

  .skill-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;

    background: rgba(0, 242, 254, 0.08);

  }
